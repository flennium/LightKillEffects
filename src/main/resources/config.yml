  prefix: "&8⟜ &6⚡ &8⟝ "
  
  # Success messages
  effect-set: "&aYour kill effect has been set to &e{effect}&a!"
  effect-disabled: "&aYour kill effect has been disabled!"
  config-reloaded: "&aConfiguration reloaded successfully!"
  
  # Error messages
  no-permission: "&cYou don't have permission to use this effect!"
  effect-not-found: "&cEffect '&e{effect}&c' not found!"
  effect-locked: "&cThis effect is locked! You need permission to use it."
  on-cooldown: "&cYou must wait &e{seconds} &cseconds before using another effect!"
  
  # GUI messages
  gui-opened: "&aOpened kill effects menu!"
  effect-previewed: "&aPreview of &e{effect} &acompleted!"
  favorite-added: "&aAdded &e{effect} &ato your favorites!"
  favorite-removed: "&aRemoved &e{effect} &afrom your favorites!"
  favorites-full: "&cYour favorites list is full! Remove one to add another."
  
  # Info messages
