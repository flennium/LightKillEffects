# LightKillEffects Configuration
# ========================================

# General Settings
general:
  # Plugin enabled/disabled
  enabled: true
  
  # Default effect for new players (set to 'none' for no default effect)
  default-effect: 'none'

  # Global cooldown between effects (in seconds)
  global-cooldown: 3

  # Maximum number of favorites per player
  max-favorites: 5

  # Enable/disable sound effects
  sounds-enabled: true

  # Show effect notifications when triggered
  show-effect-notifications: false

  # Notify players when effects are unlocked/locked
  notify-on-unlock: true
  notify-on-lock: true

  # Debug mode for development
  debug: false

  # Only trigger effects when killing players (not mobs/animals)
  players-only: true

# Security / Safety Settings
security:
  # If false, kill effects only trigger for player kills even when players-only is false.
  allow-mob-kill-effects: true

  # Allow console to set effects for online players with /killeffects set <player> <effect>.
  allow-console-set-others: true

  # If true, players can only preview effects they have unlocked unless they have killeffects.preview.all.
  require-preview-unlock: true

# Storage Settings
storage:
  # Storage backend: yaml, json, or sqlite.
  type: "yaml"

  # Maximum number of playerdata backups to keep.
  max-backups: 10

  # Create a backup before importing player data.
  backup-before-import: true

  # Prevent imports/exports outside the plugin data folder.
  restrict-imports-to-data-folder: true

# Feedback Cooldowns
# Keeps repeated chat messages and menu button feedback from spamming players.
feedback-cooldowns:
  # Turn all feedback cooldowns on or off.
  enabled: true

  # Console normally receives every message so admins do not miss errors.
  apply-to-console: false

  # What happens when a player repeats feedback before the cooldown ends.
  # ignore = keep the original cooldown, reset = extend it from the newest attempt.
  suppressed-behavior: "ignore"

  chat:
    # per-key = each message has its own timer, global = all plugin chat shares one timer.
    mode: "per-key"

    # Default chat message cooldown in milliseconds.
    default-ms: 1200

    # Optional overrides for noisy messages. Message keys match messages.yml.
    per-key:
      on-cooldown: 2000
      preview-cooldown: 2000
      no-permission: 1500
      effect-locked: 1500

  ui:
    # per-key = each UI action has its own timer, global = all UI feedback shares one timer.
    mode: "per-key"

    # Default menu click/sound feedback cooldown in milliseconds.
    default-ms: 250

    # Optional overrides for menu feedback actions.
    per-key:
      menu-open: 300
      menu-click: 200
      menu-click-sound: 200
      effect-selected: 500

# Performance Settings
performance:
  # Maximum particle count per effect
  max-particles-per-effect: 600

  # Particle render distance (blocks)
  particle-render-distance: 10

  # Effect duration limits (in ticks, 20 ticks = 1 second)
  max-effect-duration: 20
  
  # Cleanup interval for temporary blocks (in ticks)
  cleanup-interval: 200
  
  # Performance mode (reduces particles for better performance)
  performance-mode: false
  
  # Clear player cache when they quit (saves memory)
  clear-cache-on-quit: true

# GUI Settings
gui:
  # GUI title
  title: "&6&lKill Effects"
  
  # Items per page in GUI
  items-per-page: 21
  
  # GUI size (must be multiple of 9, max 54)
  size: 54
  
  # Enable GUI sounds
  gui-sounds: true
  
  # Preview Environment Settings
  preview:
    # Enable or disable the preview system
    enabled: true

    # How long a preview lasts before the player is returned (ticks, 20 = 1 second).
    duration: 120

    # Seconds before the same player can start another preview.
    cooldown: 5

    # Blocks in front of the mounted player where the effect is shown.
    location-offset: 3
    
    # World name where previews occur (set to 'world' or your preview world name)
    world: "world"
    
    # Preview location coordinates (isolated area away from players)
    x: 0
    y: 100
    z: 0
    
    # Maximum distance player can move from preview location (blocks)
    max-distance: 10 # We don't need this anymore i think

  menus:
    border:
      material: "GRAY_STAINED_GLASS_PANE"
      name: "&8 "
    current-effect:
      empty-item:
        material: "BARRIER"
        name: "&cNo Effect Selected"
        lore:
          - "&7You don't have an effect selected"
          - "&7Click on effects below to select one."
    favorites:
      title: "&6&lFavorite Effects"
      item:
        material: "NETHER_STAR"
        name: "&6Favorite Effects"
        lore:
          - "&7View your favorite effects"
          - "&7({favorites}/{max_favorites} favorites)"
          - ""
          - "&eClick to open favorites menu"
      empty-item:
        material: "BARRIER"
        name: "&cNo Favorite Effects"
        lore:
          - "&7You haven't added any effects"
          - "&7to your favorites yet."
          - ""
          - "&eRight-click effects in categories"
          - "&eto add them to favorites"
    view-effects:
      enabled:
        material: "LIME_DYE"
        name: "&aViewing Effects"
        lore:
          - "&7Kill effects are visible."
          - ""
          - "&eClick to hide effects"
      disabled:
        material: "GRAY_DYE"
        name: "&cViewing Effects"
        lore:
          - "&7Kill effects are hidden."
          - ""
          - "&eClick to show effects"
    info:
      item:
        material: "BOOK"
        name: "&bYour Statistics"
        lore:
          - "&7Total kills: &f{kills}"
          - "&7Unlocked effects: &f{unlocked}/{total}"
          - "&7Favorites: &f{favorites}"
          - ""
          - "&eClick for detailed statistics"
    category-item:
      effects-count: "&7Effects: &f{count}"
      unlocked-count: "&7Unlocked: &f{unlocked}/{total}"
      action: "&eClick to browse effects"
    effect-item:
      selected: "&aSelected"
      locked: "&cLocked"
      requires-permission: "&cRequires permission"
      select-action: "&eClick to select"
      favorite: "&6Favorite"
      favorite-label: "&6Favorite Effect"
      usage: "&7Used {usage} times"
      left-click: "&7Left-click: Select effect"
      middle-click: "&7Middle-click: Preview effect"
      right-click-add: "&7Right-click: Add to favorites"
      right-click-remove: "&7Right-click: Remove from favorites"
      remove-favorite-action: "&7Right-click to remove from favorites"
    back-item:
      material: "ARROW"
      name: "&aBack"
      lore:
        - "&7Return to main menu"
    previous-page:
      material: "ARROW"
      name: "&aPrevious Page"
      lore:
        - "&7Page {page}/{pages}"
    next-page:
      material: "ARROW"
      name: "&aNext Page"
      lore:
        - "&7Page {page}/{pages}"
