  player-not-found: "&cPlayer '{player}' not found!"
  target-no-permission: "&cPlayer {player} doesn't have permission to use kill effects!"
  effect-no-permission: "&cYou don't have permission to use {effect}!"
  effect-disabled-other: "&aDisabled kill effect for {player}!"
