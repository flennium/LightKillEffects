name: LightKillEffects
version: ${project.version}
main: org.flennn.lightkilleffects.LightKillEffects
api-version: '1.21'
description: Lightweight configurable kill effects for Paper servers
author: flennn
website: https://github.com/flennium/LightKillEffects

commands:
  killeffects:
    description: Main command for kill effects
    usage: /<command> [gui|set|reload|preview]
    aliases: [ke, effects]
    permission: killeffects.use

permissions:
  killeffects.*:
    description: Grants access to all kill effects and admin functions
    default: op
    children:
      killeffects.admin: true
      killeffects.use.*: true
  
  killeffects.admin:
    description: Administrative functions for kill effects
    default: op
    children:
      killeffects.reload: true
      killeffects.set.others: true
      killeffects.preview.all: true
      killeffects.admin.see-previews: true
  
  killeffects.use:
    description: Basic permission to use kill effects
    default: true
    children:
      killeffects.gui: true
      killeffects.preview: true
  
  killeffects.use.*:
    description: Access to all kill effects
    default: op
    children:
      killeffects.use.lightning_storm: true
      killeffects.use.solar_explosion: true
      killeffects.use.frozen_burst: true
      killeffects.use.neon_rave: true
      killeffects.use.starfall_cascade: true
      killeffects.use.prismatic_shatter: true
      killeffects.use.void_consumption: true
      killeffects.use.phoenix_rebirth: true
      killeffects.use.celestial_gateway: true
      killeffects.use.electric_overload: true
      killeffects.use.crystal_garden: true
      killeffects.use.spectral_haunt: true
      killeffects.use.laser_light_show: true
      killeffects.use.meteor_impact: true
      killeffects.use.bioluminescent_bloom: true
      killeffects.use.time_fracture: true
      killeffects.use.divine_ascension: true
      killeffects.use.toxic_meltdown: true
      killeffects.use.quantum_collapse: true
      killeffects.use.supernova: true
      killeffects.use.storm_cage: true
      killeffects.use.phantom_waltz: true
      killeffects.use.mirror_break: true
      killeffects.use.royal_execution: true
      killeffects.use.sakura_collapse: true
      killeffects.use.alchemy_failure: true
      killeffects.use.runic_forge: true
      killeffects.use.celestial_bloom: true
      killeffects.use.astral_verdict: true
      killeffects.use.time_snap: true
  
  # Individual effect permissions
  killeffects.use.lightning_storm:
    description: Lightning Storm effect - Multiple lightning bolts in circular patterns
    default: false
  
  killeffects.use.solar_explosion:
    description: Solar Explosion effect - Golden sphere with radiating light rays
    default: false
  
  killeffects.use.frozen_burst:
    description: Frozen Burst effect - Ice-blue spiraling particles with shattering ice
    default: false
  
  killeffects.use.neon_rave:
    description: Neon Rave effect - Rapidly cycling colored lights in disco fashion
    default: false
  
  killeffects.use.starfall_cascade:
    description: Starfall Cascade effect - Glowing particles falling like shooting stars
    default: true
  
  killeffects.use.prismatic_shatter:
    description: Prismatic Shatter effect - Rainbow glass particles with beacon
    default: true
  
  killeffects.use.void_consumption:
    description: Void Consumption effect - Dark purple spiral black hole effect
    default: false
  
  killeffects.use.phoenix_rebirth:
    description: Phoenix Rebirth effect - Flame particles in wing patterns
    default: false
  
  killeffects.use.celestial_gateway:
    description: Celestial Gateway effect - Rotating light portal
    default: false
  
  killeffects.use.electric_overload:
    description: Electric Overload effect - Blue electrical jumping particles
    default: false
  
  killeffects.use.crystal_garden:
    description: Crystal Garden effect - Sprouting glowing crystal blocks
    default: false
  
  killeffects.use.spectral_haunt:
    description: Spectral Haunt effect - Ghostly victim silhouette
    default: false
  
  killeffects.use.laser_light_show:
    description: Laser Light Show effect - Intersecting colored laser beams
    default: false
  
  killeffects.use.meteor_impact:
    description: Meteor Impact effect - Fiery crater creation
    default: false
  
  killeffects.use.bioluminescent_bloom:
    description: Bioluminescent Bloom effect - Gentle spreading spore-like glow
    default: true
  
  killeffects.use.time_fracture:
    description: Time Fracture effect - Reality-cracking effect
    default: false
  
  killeffects.use.divine_ascension:
    description: Divine Ascension effect - Golden double helix spiral
    default: false
  
  killeffects.use.toxic_meltdown:
    description: Toxic Meltdown effect - Bubbling green corrosive spread
    default: false
  
  killeffects.use.quantum_collapse:
    description: Quantum Collapse effect - Phasing victim effect
    default: false
  
  killeffects.use.supernova:
    description: Supernova effect - Intense white light explosion
    default: false

  killeffects.use.storm_cage:
    description: Storm Cage effect - Charged prison that detonates with voltage
    default: false

  killeffects.use.phantom_waltz:
    description: Phantom Waltz effect - Ghostly dancers spiral around the victim
    default: false

  killeffects.use.mirror_break:
    description: Mirror Break effect - Reflective panels shatter into fragments
    default: false

  killeffects.use.royal_execution:
    description: Royal Execution effect - Regal crown and sigil finisher
    default: false

  killeffects.use.sakura_collapse:
    description: Sakura Collapse effect - Blossoming petals collapse into a vortex
    default: false

  killeffects.use.alchemy_failure:
    description: Alchemy Failure effect - Unstable magical brew erupts in color
    default: false

  killeffects.use.runic_forge:
    description: Runic Forge effect - Molten forge runes ignite the ground
    default: false

  killeffects.use.celestial_bloom:
    description: Celestial Bloom effect - A radiant flower opens in the air
    default: false

  killeffects.use.astral_verdict:
    description: Astral Verdict effect - Constellations align for a judgment beam
    default: false

  killeffects.use.time_snap:
    description: Time Snap effect - Afterimages freeze before reality snaps back
    default: false
  
  # Utility permissions
  killeffects.gui:
    description: Access to kill effects GUI
    default: true
  
  killeffects.reload:
    description: Reload plugin configuration
    default: op
  
  killeffects.set.others:
    description: Set kill effects for other players
    default: op
  
  killeffects.preview.all:
    description: Preview any kill effect
    default: op

  killeffects.preview:
    description: Preview unlocked kill effects
    default: true

  killeffects.admin.see-previews:
    description: See players while they are in the preview area
    default: op
